name: ci-pr-js
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: event shas (trial probe)
        shell: bash
        env:
          EV_ACTION: ${{ github.event.action }}
          EV_BASE: ${{ github.event.pull_request.base.sha }}
          EV_HEAD: ${{ github.event.pull_request.head.sha }}
          EV_SHA: ${{ github.sha }}
        run: |
          echo "action=$EV_ACTION base=$EV_BASE head=$EV_HEAD github.sha=$EV_SHA"
          echo "shallow=$(git rev-parse --is-shallow-repository)"
          for s in "$EV_BASE" "$EV_HEAD"; do git cat-file -e "$s^{commit}" && echo "present $s" || echo "MISSING $s"; done
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: npm ci --no-audit --no-fund
      - id: tests
        shell: bash
        run: |
          set +e
          if grep -q '"vitest"' package.json; then fw=vitest
            npx vitest run --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/report.json"; rc=$?
          else fw=jest
            npx jest --ci --json --outputFile="$RUNNER_TEMP/report.json"; rc=$?
          fi
          echo "rc=$rc" >> "$GITHUB_OUTPUT"; echo "fw=$fw" >> "$GITHUB_OUTPUT"; echo "$fw rc=$rc"
      - id: pb
        if: steps.tests.outputs.rc != '0'
        uses: ./.github/actions/provebreak-culprit-pr
        with:
          runner: ${{ steps.tests.outputs.fw }}
          report: ${{ runner.temp }}/report.json
      - if: always()
        run: 'echo "pb_status=${{ steps.pb.outputs.status }} culprit=${{ steps.pb.outputs.culprit_sha }}"'
      - if: steps.tests.outputs.rc != '0'
        run: exit 1
